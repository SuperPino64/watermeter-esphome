# WILLIAM_TEST_v1.3

# These substitutions allow the end user to override certain values
substitutions:
  name: "muino-water-meter"

esphome:
  name: "${name}"
  # Automatically add the mac address to the name
  # so you can use a single firmware for all devices
  name_add_mac_suffix: true
  platformio_options:
    board_build.flash_mode: "dio"

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

# Triggers reading adc values and iterating algorithm
interval:
  - interval: 100ms
    then:
      - output.turn_on: sensor_power
      - component.update: light_sensor_a_dark

      - if:
          condition:
            lambda: |-
              return id(fastupdate).state;

          then:
            - lambda: |-
                // 180° meter only
                // 1 phase = 1/6 liter = 166.667 ml
                id(last_reported_liters__mili) =
                    id(liters) * 1000 +
                    ((id(phase) * 1000) / 6);

                id(last_reported_liters) = id(liters);

                // last_water_flow wordt elders bijgewerkt
                // bij een echte faseverandering

            - if:
                condition:
                  lambda: |-
                    return id(debugmodus).state;
                then:
                  # debug acties hier

          else:
            - lambda: |-

                // Alleen tijdens stilstand periodiek publiceren
                id(last_reported_liters__mili) =
                    id(liters) * 1000 +
                    ((id(phase) * 1000) / 6);

                id(last_reported_liters) = id(liters);

# Toggle switch
switch:
  - platform: template 
    optimistic: true
    id: fastupdate
    name: Speed mode
    icon: "mdi:emoticon-cool-outline"
    restore_mode: ALWAYS_ON

  - platform: template
    optimistic: true
    id: debugmodus
    name: Debug mode
    icon: "mdi:bug"
    
  # for manual calibration or auto
  - platform: template
    id: calibration_mode
    name: "Manual Calibration"
    icon: "mdi:tune-vertical"
    lambda: |-
      return id(manual_calibration);
    turn_on_action:
      - lambda: |-
          id(manual_calibration) = true;
    turn_off_action:
      - lambda: |-
          id(manual_calibration) = false;

button:
  - platform: template
    name: "Reset Calibration"
    icon: "mdi:restart"
    on_press:
      - lambda: |-
          int min = id(lower_bound);
          int a = id(light_sensor_a_light).state - id(light_sensor_a_dark).state;
          if (a < min) a = id(light_sensor_a_light).state;
          int b = id(light_sensor_b_light).state - id(light_sensor_b_dark).state;
          if (b < min) b = id(light_sensor_b_light).state;
          int c = id(light_sensor_c_light).state - id(light_sensor_c_dark).state;
          if (c < min) c = id(light_sensor_c_light).state;
          ESP_LOGI(
              "calibration",
              "Calibration reset requested. New baseline: A=%d B=%d C=%d, liters reset to 0",
              a,
              b,
              c
          );
          id(liters) = 0;
          id(flow_rate_current) = 0.0;
          id(flow_rate_last) = 0.0;

          id(current_consumption) = 0.0;
          id(previous_consumption) = 0.0;

          id(consumption_start_time) = 0;
          id(consumption_start_liters) = 0;
          
          id(min_a)= a;
          id(min_b)= b;
          id(min_c)= c;
          id(max_a)= a;
          id(max_b)= b;
          id(max_c)= c;
          ESP_LOGI( "calibration", "Calibration reset. All consumption and flow statistics cleared.");

output:
  - platform: gpio
    pin: 7
    id: led
  - platform: gpio
    pin: 6
    id: sensor_power

sensor:
  - platform: adc
    pin: 
      number: 2
      allow_other_uses: true
      ignore_strapping_warning: true
    name: "light_sensor_a_dark"
    id: light_sensor_a_dark
    raw: true
    internal: true
    on_value:
      then:
        component.update: light_sensor_b_dark
  - platform: adc
    pin: 
      number: 3
      allow_other_uses: true
    id: light_sensor_b_dark
    name: "light_sensor_b_dark"
    raw: true
    internal: true
    on_value:
      then:
        component.update: light_sensor_c_dark
    
  - platform: adc
    pin: 
      number: 4
      allow_other_uses: true
    id: light_sensor_c_dark
    name: "light_sensor_c_dark"
    raw: true
    internal: true
    on_value:
      then:
        - output.turn_on: led
        - delay: 50ms
        - component.update: light_sensor_a_light

  - platform: adc
    pin: 
      number: 2
      allow_other_uses: true

      ignore_strapping_warning: true
    name: "light_sensor_a_light"
    id: light_sensor_a_light
    raw: true
    internal: true
    on_value:
      then:
        component.update: light_sensor_b_light

  - platform: adc
    pin: 
      number: 3
      allow_other_uses: true
    id: light_sensor_b_light
    name: "light_sensor_b_light"
    raw: true
    internal: true
    on_value:
      then:
        - component.update: light_sensor_c_light
    
  - platform: adc
    pin: 
      number: 4
      allow_other_uses: true
    id: light_sensor_c_light
    name: "light_sensor_c_light"
    raw: true
    internal: true
    on_value:
      then:
        - output.turn_off: led
        #- output.turn_off: sensor_power
        - component.update: phase_coarse
  # keep track last time updated

# dark sensor values
  - platform: template
    name: "sensa_dark"
    force_update: false
    internal: true
    id: ad
    device_class: "ILLUMINANCE"
    unit_of_measurement: "lx"
    accuracy_decimals: 0 
    lambda: |-
      return id(light_sensor_a_dark).state;

  - platform: template
    name: "sensb_dark"
    id: bd
    force_update: false
    internal: true
    device_class: "ILLUMINANCE"
    unit_of_measurement: "lx"
    accuracy_decimals: 0 
    lambda: |-
      return id(light_sensor_b_dark).state;

  - platform: template
    name: "sensc_dark"
    force_update: false
    internal: true
    id: cd
    device_class: "ILLUMINANCE"
    unit_of_measurement: "lx"
    accuracy_decimals: 0 
    lambda: |-
      return id(light_sensor_c_dark).state;

# sensor values
  - platform: template
    name: "sensa"
    force_update: true
    internal: true
    id: al
    device_class: "ILLUMINANCE"
    unit_of_measurement: "lx"
    accuracy_decimals: 0 
    lambda: |-
      return id(light_sensor_a_light).state;

  - platform: template
    name: "sensb"
    force_update: true
    internal: true
    id: bl
    device_class: "ILLUMINANCE"
    unit_of_measurement: "lx"
    accuracy_decimals: 0 
    lambda: |-
      return id(light_sensor_b_light).state;

  - platform: template
    name: "sensc"
    force_update: true
    internal: true
    id: cl
    device_class: "ILLUMINANCE"
    unit_of_measurement: "lx"
    accuracy_decimals: 0 
    lambda: |-
      return id(light_sensor_c_light).state;
      
# substracted values
  - platform: template
    name: "sensa_sub"
    id: as
    force_update: false
    internal: false
    update_interval: never
    device_class: "ILLUMINANCE"
    unit_of_measurement: "lx"
    accuracy_decimals: 0 
    lambda: |-
    
      return id(aa);

  - platform: template
    name: "sensb_sub"
    force_update: false
    internal: false
    update_interval: never
    id: bs
    device_class: "ILLUMINANCE"
    unit_of_measurement: "lx"
    accuracy_decimals: 0 
    lambda: |-
      return id(bb);

  - platform: template
    name: "sensc_sub"
    force_update: false
    internal: false
    update_interval: never
    id: cs
    device_class: "ILLUMINANCE"
    unit_of_measurement: "lx"
    accuracy_decimals: 0 
    lambda: |-
      return id(cc);
      
  - platform: template
    name: "Phase"
    id: phase_sensor
    internal: false
    force_update: false
    update_interval: never
    accuracy_decimals: 0
    lambda: |-
      return id(phase);
    
  - platform: template
    name: "Muino Water Total (L)"
    id: report_liters_ml
    force_update: false
    update_interval: 1s
    device_class: "water"
    unit_of_measurement: "L"
    accuracy_decimals: 3
    state_class: total_increasing
    lambda: |-
      if (id(liters) < 2){
        return 0;
      }    
      return id(last_reported_liters__mili)/1000.0;

  - platform: template
    name: "liters"
    id: report_liters_rounded
    force_update: false
    update_interval: 1s
    device_class: "water"
    unit_of_measurement: "L"
    accuracy_decimals: 0 
    state_class: total_increasing
    lambda: |-
      if (id(last_reported_liters) < 2){
        return 0;
      }  
      return id(last_reported_liters);

  # Flow rate sensors
  - platform: template
    name: "Flow Rate Current"
    id: flow_rate_current_sensor
    force_update: false
    update_interval: 1s
    unit_of_measurement: "L/min"
    accuracy_decimals: 2
    state_class: measurement
    lambda: |-
      return id(flow_rate_current);

  - platform: template
    name: "Flow Rate Last"
    id: flow_rate_last_sensor
    force_update: false
    update_interval: 5s
    unit_of_measurement: "L/min"
    accuracy_decimals: 2
    state_class: measurement
    lambda: |-
      return id(flow_rate_last);

  # Consumption sensors
  - platform: template
    name: "Current Consumption"
    id: current_consumption_sensor
    force_update: false
    update_interval: 1s
    device_class: "water"
    unit_of_measurement: "L"
    accuracy_decimals: 1
    lambda: |-
      if (id(current_consumption) < 0) return 0;
      return id(current_consumption);

  - platform: template
    name: "Previous Consumption"
    id: previous_consumption_sensor
    force_update: false
    update_interval: 5s
    device_class: "water"
    unit_of_measurement: "L"
    accuracy_decimals: 1
    lambda: |-
      return id(previous_consumption);

  - platform: template
    id: phase_coarse
    device_class: "water"
    state_class: "total"
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: |-
                return id(debugmodus).state;
            then:
              - component.update: as
              - component.update: bs
              - component.update: cs
              - component.update: phase_sensor
              - component.update: report_liters_ml
              - component.update: report_liters_rounded
              - component.update: flow_rate_current_sensor
              - component.update: flow_rate_last_sensor
              - component.update: current_consumption_sensor
              - component.update: previous_consumption_sensor
    lambda: |-
      static bool first = true;

      // Read the raw values from the sensors
      int a = id(light_sensor_a_light).state - id(light_sensor_a_dark).state;
      int b = id(light_sensor_b_light).state - id(light_sensor_b_dark).state;
      int c = id(light_sensor_c_light).state - id(light_sensor_c_dark).state;

      if (first){
          ESP_LOGI( "startup", "liters=%d start_liters=%d current_consumption=%.1f", id(liters), id(consumption_start_liters), id(current_consumption));
          id(flow_rate_current) = 0.0;
          id(flow_rate_last) = 0.0;

          id(current_consumption) = 0.0;
          id(previous_consumption) = 0.0;

          id(consumption_start_time) = 0;
          id(consumption_start_liters) = 0;

          id(last_flow_time) = 0;
          id(last_water_flow) = millis();

          id(a_history)[0] = a;
          id(a_history)[1] = a;
          id(a_history)[2] = a;

          id(b_history)[0] = b;
          id(b_history)[1] = b;
          id(b_history)[2] = b;

          id(c_history)[0] = c;
          id(c_history)[1] = c;
          id(c_history)[2] = c;

          id(min_a)= a;
          id(min_b)= b;
          id(min_c)= c;

          id(max_a)= a;
          id(max_b)= b;
          id(max_c)= c;

          first = false;
          return 0;
      }
      
      // Update history buffers
      id(a_history)[id(history_index)] = a;
      id(b_history)[id(history_index)] = b;
      id(c_history)[id(history_index)] = c;

      // Compute moving averages
      id(smoothed_a) = (id(a_history)[0] + id(a_history)[1] + id(a_history)[2]) / 3;
      id(smoothed_b) = (id(b_history)[0] + id(b_history)[1] + id(b_history)[2]) / 3;
      id(smoothed_c) = (id(c_history)[0] + id(c_history)[1] + id(c_history)[2]) / 3;

      // Move to the next history index
      id(history_index) = (id(history_index) + 1) % 3;

      // Use the smoothed values instead of raw values
      id(aa) = id(smoothed_a);
      id(bb) = id(smoothed_b);
      id(cc) = id(smoothed_c);

      a = id(smoothed_a);
      b = id(smoothed_b);
      c = id(smoothed_c);

      int max = id(upper_bound);
      int min = id(lower_bound);

      if (a < min || b < min || c < min ){
        ESP_LOGW("light_level", "Signal too weak. Possible causes: too bright environment, LED failure, or sensor misalignment. Ignoring measurement.");
        return 0;
      }
      if (a > max || b > max || c > max){
        ESP_LOGW("light_level", "Too bright, ignoring this measurement");
        return 0;
      }


      ESP_LOGD( "phase_loop", "phase_coarse active");
      float alpha_cor = 0.001;
      if (id(liters) < 2) {
          alpha_cor = 0.1; // when 2 liter not found correct harder
          if (id(liters) < 0) {
              // Reset calibration if negative liters detected  
              id(liters) = 0;
              id(min_a)= a;
              id(min_b)= b;
              id(min_c)= c;
              id(max_a)= a;
              id(max_b)= b;
              id(max_c)= c;
          }
      }

      auto mini_average = [](float x, float y, float alpha_cor){
        if ((x + 5) <= y && y > 10) {
            return x;
        } else {
            return (1 - alpha_cor) * x + alpha_cor * y;
        }
      };
      auto max_average = [](int x, int y, float alpha_cor) {
        // ESP_LOGI("main", "x: %d, y: %d, a: %f",x,y,alpha_cor);
        if ((x - 5) >= y && y < 2500) {
            return x;
        } else {
            return (int)((1 - alpha_cor) * (float)x + alpha_cor * (float)y);
        }
      };
      id(min_a)= mini_average(id(min_a), a, alpha_cor);
      id(min_b)= mini_average(id(min_b), b, alpha_cor);
      id(min_c)= mini_average(id(min_c), c, alpha_cor);
      id(max_a)= max_average(id(max_a), a, alpha_cor);
      id(max_b)= max_average(id(max_b), b, alpha_cor);
      id(max_c)= max_average(id(max_c), c, alpha_cor);

      if (id(manual_calibration)) {
        // Manual offsets
        a -= id(manual_offset_a);
        b -= id(manual_offset_b);
        c -= id(manual_offset_c);
        id(min_a)= id(manual_offset_a);
        id(min_b)= id(manual_offset_b);
        id(min_c)= id(manual_offset_c);
        id(max_a)= id(manual_offset_a)+2;
        id(max_b)= id(manual_offset_b)+2;
        id(max_c)= id(manual_offset_c)+2;
      } else {
        // Auto-calibration offsets
        a -= (id(min_a) + id(max_a)) >> 1;
        b -= (id(min_b) + id(max_b)) >> 1;
        c -= (id(min_c) + id(max_c)) >> 1;
      }
      // log with manual calibration the offset and without first string manual_ofset* tehn the auto calibration one 
      ESP_LOGD("calibration", "a_offset:%d b_offset:%d c_offset:%d | a_auto:%d b_auto:%d c_auto:%d",
                id(manual_offset_a), id(manual_offset_b), id(manual_offset_c),
                (id(min_a) + id(max_a)) >> 1,
                (id(min_b) + id(max_b)) >> 1,
                (id(min_c) + id(max_c)) >> 1);

      // Ensure phase always stays within valid range
      int current_phase = id(phase);
      if (current_phase < 0)
          current_phase = 0;

      if (current_phase > 5)
          current_phase = 5;
      id(phase) = current_phase;
      short pn[5];

      if (current_phase & 1)
          pn[0] = a + a - b - c,
          pn[1] = b + b - a - c,
          pn[2] = c + c - a - b;
      else
          pn[0] = b + c - a - a,
          pn[1] = a + c - b - b,
          pn[2] = a + b - c - c;

      pn[3] = pn[0];
      pn[4] = pn[1];
      
      short i = (current_phase > 2) ? current_phase - 3 : current_phase;
      int phase_before = current_phase;
      
      if (pn[i + 2] < pn[i + 1] && pn[i + 2] < pn[i]){
          uint32_t current_time = millis();
          id(last_water_flow) = current_time;
          
          // Simple flow rate calculation based on time between phase changes
          if (id(last_flow_time) > 0) {
            uint32_t time_diff = current_time - id(last_flow_time);
            if (time_diff > 0) {
              // Flow rate based on phase changes (6 phases = 1 liter)
              // Each phase = 1/6 liter, time_diff in ms
              //float liters_per_phase = 1.0 / 6.0; float flow_rate = (liters_per_phase * 60000.0) / float(time_diff);

              float flow_rate = 10000.0f / float(time_diff); // L/min
              if (flow_rate > 50.0f) flow_rate = 50.0f;
              
              // Smooth the flow rate with exponential moving average
              if (id(flow_rate_current) == 0.0) {
                id(flow_rate_current) = flow_rate;
              } else {
                id(flow_rate_current) = 0.7 * id(flow_rate_current) + 0.3 * flow_rate;
              }
            }
          }
          
          id(last_flow_time) = current_time;
          id(last_flow_liters) = id(liters);
          
          if (pn[i + 1] > pn[i])
              id(phase)++;
          else
              id(phase)--;
              
          int phase_after = id(phase);

          // Verwachte volgende fase
          int expected_forward = (phase_before + 1) % 6;
          int expected_backward = (phase_before + 5) % 6;

          bool valid =
                phase_after == expected_forward
             || phase_after == expected_backward
             || phase_after == 6
             || phase_after == -1;

          if (!valid) {
              ESP_LOGW(
                  "phase_check",
                  "Unexpected phase jump %d -> %d",
                  phase_before,
                  phase_after);
          }
          ESP_LOGI("phase_trace", "phase %d -> %d", phase_before, phase_after);
      }
      
      // Auto-reset consumption after 5 seconds of no flow
      if ((millis() - id(last_water_flow)) >= 5000) {
        if (id(current_consumption) > 0.0 ||
            id(flow_rate_current) > 0.0) {
          ESP_LOGI(
              "flow",
              "No flow detected for 5s. Resetting consumption %.1f L and flow rate %.2f L/min",
              id(current_consumption),
              id(flow_rate_current)
          );
          id(previous_consumption) = id(current_consumption);
          id(flow_rate_last) = id(flow_rate_current);
          id(current_consumption) = 0.0;
          id(consumption_start_time) = 0;
          id(consumption_start_liters) = 0;
          id(flow_rate_current) = 0.0;
        }
      }
      
      if (id(phase) == 6) {
          ESP_LOGI( "liter_counter", "PHASE WRAP: phase=6, liters %d -> %d", id(liters), id(liters) + 1);
          id(liters)++;
          id(phase) = 0;
          
          // Auto-start consumption tracking on first flow
          if (id(consumption_start_time) == 0) {
            id(consumption_start_time) = millis();
            id(consumption_start_liters) = id(liters) - 1; //vreemd
          }
          ESP_LOGI( "consumption", "liters=%d start=%d result=%.1f", id(liters), id(consumption_start_liters), float(id(liters) - id(consumption_start_liters)));
          id(current_consumption) = float(id(liters) - id(consumption_start_liters));
      }
      else if (id(phase) == -1) {
          ESP_LOGI( "liter_counter", "PHASE WRAP REVERSE: phase=-1, liters %d -> %d", id(liters),id(liters) - 1);
          id(liters)--;
          id(phase) = 5;
          
          // Handle reverse flow
          if (id(consumption_start_time) == 0) {
            id(consumption_start_time) = millis();
            id(consumption_start_liters) = id(liters) + 1;
          }
          ESP_LOGI( "consumption", "liters=%d start=%d result=%.1f", id(liters), id(consumption_start_liters), float(id(liters) - id(consumption_start_liters)));
          id(current_consumption) = float(id(liters) - id(consumption_start_liters));
      }
          
      return id(liters);


globals:
  - id: last_reported_liters
    type: int
    initial_value: '0'
  - id: last_reported_liters__mili
    type: int
    initial_value: '0'
  - id: last_water_flow
    type: uint32_t
    initial_value: '0'
  - id: phase
    type: int
    initial_value: "0"
  - id: liters
    type: int
    initial_value: "0"
  # Flow rate tracking variables
  - id: flow_rate_current
    type: float
    initial_value: "0.0"
  - id: flow_rate_last
    type: float
    initial_value: "0.0"
  - id: last_flow_time
    type: uint32_t
    initial_value: '0'
  - id: last_flow_liters
    type: int
    initial_value: '0'
  # Consumption tracking
  - id: current_consumption
    type: float
    initial_value: "0.0"
  - id: previous_consumption
    type: float
    initial_value: "0.0"
  - id: consumption_start_time
    type: uint32_t
    initial_value: '0'
  - id: consumption_start_liters
    type: int
    initial_value: '0'
  - id: aa
    type: int
    initial_value: "0"
  - id: bb
    type: int
    initial_value: "0"
  - id: cc
    type: int
    initial_value: "0"
  - id: max_a
    type: int
  - id: max_b
    type: int
  - id: max_c
    type: int
  - id: min_a
    type: int
  - id: min_b
    type: int
  - id: min_c
    type: int
  - id: upper_bound
    initial_value: "1500"
    type: int
  - id: lower_bound
    type: int
    initial_value: "5"

  # Switch that toggles between auto-calibration and manual calibration
  - id: manual_calibration
    type: bool
    restore_value: yes  # <--- important
    initial_value: "false"

  # Manual offsets for a, b, c
  - id: manual_offset_a
    type: int
    restore_value: yes
    initial_value: "0"
  - id: manual_offset_b
    type: int
    restore_value: yes
    initial_value: "0"
  - id: manual_offset_c
    type: int
    restore_value: yes
    initial_value: "0"

    # Parameters for the moving average of size 3
  - id: a_history
    type: int[3]
    initial_value: "{0, 0, 0}"
  - id: b_history
    type: int[3]
    initial_value: "{0, 0, 0}"
  - id: c_history
    type: int[3]
    initial_value: "{0, 0, 0}"
  - id: history_index
    type: int
    initial_value: "0"

  - id: smoothed_a
    type: int
    initial_value: "0"
  - id: smoothed_b
    type: int
    initial_value: "0"
  - id: smoothed_c
    type: int
    initial_value: "0"

number:
  - platform: template
    id: offset_a_number
    name: "Offset A (0-3300)"
    min_value: 0
    max_value: 3300
    step: 1
    lambda: return id(manual_offset_a);
    set_action:
      then:
        - lambda: |-
            id(manual_offset_a) = (int) x;

  - platform: template
    id: offset_b_number
    name: "Offset B (0-3300)"
    min_value: 0
    max_value: 3300
    step: 1
    lambda: return id(manual_offset_b);
    set_action:
      then:
        - lambda: |-
            id(manual_offset_b) = (int) x;
 
  - platform: template
    id: offset_c_number
    name: "Offset C (0-3300)"
    min_value: 0
    max_value: 3300
    step: 1
    lambda: return id(manual_offset_c);
    set_action:
      then:
        - lambda: |-
            id(manual_offset_c) = (int) x;

